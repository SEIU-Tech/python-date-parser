[build-system]
requires = ["maturin>=1.15"]
build-backend = "maturin"

[project]
name = "gnosis-date-parser"
version = "0.2.0"
description = "Fast fuzzy parsing of dates in varying formats."
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.10"
authors = [{ name = "David Mertz" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: BSD License",
]
# Polars is an OPTIONAL dependency: it is only needed for the
# `parse_series()` convenience API. Install it with the extra
# `pip install gnosis-date-parser[polars]`; without it, `parse()` and
# `parse_list()` still work, and `parse_series()` raises an informative
# ImportError when called.
dependencies = []

[project.optional-dependencies]
polars = [
    "polars>=1.44.2",
]
dev = [
    "maturin>=1.15",
    "pytest>=8",
    "mypy>=1.13",
    "ruff>=0.7",
    "mkdocs-material>=9.5",
    "ipython>=8.39.0",
    # The dev environment exercises all three APIs, so it includes the
    # optional Polars extra alongside the reference parsers used only by
    # bin/benchmark.py (which are not runtime dependencies of the
    # date_parser extension itself).
    "polars>=1.44.2",
    "dateparser>=1.4.3",
    "pandas>=2.3,<3",
]

[project.urls]
Repository = "https://github.com/SEIU-Tech/python-date-parser"

[tool.maturin]
module-name = "date_parser"
python-source = "."
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
