[build-system]
requires = ["maturin>=1.15"]
build-backend = "maturin"

[project]
name = "gnosis-date-parser"
version = "1.0.1"
description = "Fast fuzzy parsing of dates in varying formats."
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.10"
authors = [{ name = "David Mertz" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: BSD License",
]
dependencies = [
    "dateparser>=1.4.3",
    "polars>=1.44.2",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.15",
    "pytest>=8",
    "mypy>=1.13",
    "ruff>=0.7",
    "mkdocs-material>=9.5",
    "ipython>=8.39.0",
]

[project.urls]
Repository = "https://github.com/SEIU-Tech/python-date-parser"

[tool.maturin]
module-name = "date_parser"
python-source = "."
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
